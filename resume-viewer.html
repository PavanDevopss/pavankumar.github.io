<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Embedded PDF viewer for Vadala Pavan Kumar's resume.">
  <title>Resume Viewer | Vadala Pavan Kumar</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f3f4f6;
      --panel-bg: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --border: #d1d5db;
      --primary: #0f766e;
      --primary-hover: #115e59;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      background: linear-gradient(180deg, #e5f3f1 0%, var(--page-bg) 38%, #eef2ff 100%);
      color: var(--text);
    }

    .viewer-shell {
      width: min(1200px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1rem 0 1.5rem;
    }

    .viewer-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 1rem 1.25rem;
      border: 1px solid rgba(15, 118, 110, 0.18);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
    }

    .viewer-copy h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
    }

    .viewer-copy p {
      margin: 0;
      color: var(--muted);
    }

    .viewer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.8rem 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .button.primary {
      background: var(--primary);
      color: #ffffff;
    }

    .button.primary:hover,
    .button.primary:focus-visible {
      background: var(--primary-hover);
    }

    .button.secondary {
      border: 1px solid var(--border);
      background: var(--panel-bg);
      color: var(--text);
    }

    .button.secondary:hover,
    .button.secondary:focus-visible {
      border-color: var(--primary);
      color: var(--primary);
    }

    .viewer-frame {
      height: calc(100vh - 9rem);
      min-height: 640px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 20px;
      overflow: hidden;
      background: var(--panel-bg);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    .viewer-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .viewer-fallback {
      margin-top: 0.85rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .viewer-fallback a {
      color: var(--primary);
      font-weight: 600;
    }

    @media (max-width: 720px) {
      .viewer-shell {
        width: min(100% - 1rem, 1200px);
      }

      .viewer-frame {
        height: calc(100vh - 11.5rem);
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <main class="viewer-shell">
    <section class="viewer-topbar">
      <div class="viewer-copy">
        <h1>Resume PDF Viewer</h1>
        <p>If the embedded preview does not load, use the direct open or download buttons.</p>
      </div>
      <div class="viewer-actions">
        <a class="button primary" href="resume.pdf?v=20260420-1910" target="_blank" rel="noopener noreferrer">Open PDF Directly</a>
        <a class="button secondary" href="resume.pdf" download>Download Resume</a>
      </div>
    </section>

    <section class="viewer-frame" aria-label="Embedded resume viewer">
      <iframe src="resume.pdf?v=20260420-1910#view=FitH" title="Resume PDF"></iframe>
    </section>

    <p class="viewer-fallback">
      Browser not showing the PDF inline?
      <a href="resume.pdf?v=20260420-1910" target="_blank" rel="noopener noreferrer">Try opening the file in a new tab</a>.
    </p>
  </main>
</body>
</html>
